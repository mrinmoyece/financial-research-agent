[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-research-agent"
version = "1.0.0"
description = "LangGraph 1.x-powered autonomous equity research agent"
requires-python = ">=3.12"
# Key runtime versions (see requirements.txt):
#   langgraph==1.2.5
#   langchain==1.0.0
#   fastapi==0.115.4, pydantic==2.9.2
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Coverage flags passed explicitly in CI (ci.yml): --cov=src --cov-report=xml --cov-fail-under=80
# Omitting --cov here keeps local `pytest` fast and avoids filesystem permission issues in containers.
addopts = "-v"

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit security checks
    "N",   # pep8 naming
]
ignore = [
    "S101",  # assert statements are fine in tests
    "B008",  # FastAPI Depends() in function defaults
]

[tool.ruff.per-file-ignores]
"tests/**" = ["S", "N"]   # relax security + naming in tests

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
