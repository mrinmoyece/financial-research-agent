services:
  # ── Financial Research Agent ───────────────────────────────────────────────
  financial-research-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial-research-agent
    ports:
      - "8080:8080"
    environment:
      # LLM — swap to azure_openai for production
      - LLM_PROVIDER=github_models
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_CHAT_MODEL=gpt-4o
      # Data APIs (optional — tools fall back to mock data if absent)
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
      - NEWSAPI_API_KEY=${NEWSAPI_API_KEY:-}
      - ALLOW_MOCK_DATA=${ALLOW_MOCK_DATA:-true}
      # LangSmith tracing (optional)
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=financial-research-agent
      # Redis cache
      - REDIS_URL=redis://redis:6379
      - REDIS_REQUIRED=true
      - API_AUTH_REQUIRED=${API_AUTH_REQUIRED:-false}
      - API_KEY=${API_KEY:-}
      - MAX_REQUEST_BODY_BYTES=65536
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:8080}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/api/v1/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - agent-net

  # ── Redis (result cache) ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: financial-research-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - agent-net

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: financial-research-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped
    networks:
      - agent-net

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.2
    container_name: financial-research-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge

volumes:
  grafana-data:
